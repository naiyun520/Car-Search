spring:
  application:
    name: car-search-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/car_inquiry?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:car_inquiry}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 64KB
      max-request-size: 96KB
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: application/json,text/html,text/css,application/javascript,image/svg+xml
  tomcat:
    max-http-form-post-size: 32KB
    threads:
      max: ${TOMCAT_MAX_THREADS:100}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:10}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
car:
  client-protocol: "20260921.1"
  data-encrypt-key: ${DATA_ENCRYPT_KEY:}
  # 本地界面联调专用。生产环境必须保持 false；即使开启也只接受回环地址请求。
  dev-login-enabled: ${CAR_DEV_LOGIN_ENABLED:false}
  storage-path: ${CAR_STORAGE_PATH:./runtime/uploads}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
logging:
  level:
    root: INFO
    cn.naiblog.carsearch: INFO
debug: false
