spring:
  application:
    name: car-search-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # 必须由部署环境显式提供，避免缺少配置时误连远程或生产数据库。
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: application/json,text/html,text/css,application/javascript,image/svg+xml
  tomcat:
    max-http-form-post-size: 10MB
    threads:
      max: ${TOMCAT_MAX_THREADS:100}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:10}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
car:
  client-protocol: "20260921.1"
  data-encrypt-key: ${DATA_ENCRYPT_KEY:}
  # 唯一查询执行器。false 仅暂停调度，不会退回旧调用。
  query-jobs-enabled: ${CAR_QUERY_JOBS_ENABLED:true}
  local-test-only: ${CAR_LOCAL_TEST_ONLY:false}
  # 本地界面联调专用。生产环境必须保持 false；即使开启也只接受回环地址请求。
  dev-login-enabled: ${CAR_DEV_LOGIN_ENABLED:false}
  storage-path: ${CAR_STORAGE_PATH:./runtime/uploads}
  # 查询并发数（1-8），与付款退款、邮件等调度隔离。
  query-worker-count: ${CAR_QUERY_WORKER_COUNT:4}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
logging:
  level:
    root: INFO
    cn.naiblog.carsearch: INFO
debug: false
